<!doctype html>
<html lang="en" class="liftosaur-app">
  <head>
    <meta charset="utf-8" />
    <title>Lyteweight</title>
    <link rel="stylesheet" type="text/css" href="/app.css?version=xxxxxxxx" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1, minimum-scale=1, target-densitydpi=device-dpi, height=device-height"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Lyteweight" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="application-name" content="Lyteweight" />
    <link rel="preload" href="/images/front-muscles.svg" as="image" />
    <link rel="preload" href="/images/back-muscles.svg" as="image" />
    <link rel="preload" href="/images/svgs/muscles-combined.svg" as="image" />
    <link rel="preload" href="/images/svgs/musclegroups-combined.svg" as="image" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png" />
    <link rel="shortcut icon" type="image/x-icon" href="/icons/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Lyteweight: a powerlifting training tracker, based on Liftosaur" />
    <!--
      Lyteweight has no error reporting or analytics. The app still calls Rollbar.configure/Rollbar.error in
      places, so provide a no-op stand-in that just logs errors to the console.
    -->
    <script>
      window.Rollbar = {
        configure: function () {},
        error: function () {
          console.error.apply(console, arguments);
        },
      };
    </script>
    <style>
      html,
      #app {
        height: 100%;
      }
    </style>
  </head>
  <body class="bg-background-default text-text-primary">
    <div id="app"></div>
    <div id="modal"></div>
    <div id="bottomsheet"></div>
    <div id="keyboard"></div>
    <noscript>JavaScript is required for Lyteweight to work</noscript>
    <script src="/vendors.js?vendor=xxxxxxxx"></script>
    <script src="/app.js?version=xxxxxxxx"></script>
  </body>
</html>
<!-- LFTEND -->
